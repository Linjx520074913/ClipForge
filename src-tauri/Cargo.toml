[package]
name = "clipforge"
version = "0.1.0"
description = "Online Video Editor"
authors = ["linjx"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipforge"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

tokio = { version = "1", features = ["full"] }
futures-intrusive = "0.5.0"

image      = "0.25"         # ✅ 最新图像处理库，兼容性好
winit      = "0.30.0"       # ✅ 适用于 wgpu 0.26
wgpu       = "26.0.1"       # ✅ 最新稳定版，来自 crates.io
cgmath     = "0.18"         # ✅ 常用 3D 数学库
env_logger = "0.11"         # ✅ 与 log 0.4 兼容
log        = "0.4"          # ✅ 标准日志库
pollster   = "0.4.0"        # ✅ 异步阻塞工具，适配 wgpu 初始化
indexmap   = "2.10.0"       # ✅ 高效索引映射
bytemuck   = "1.14.0"       # ✅ 高性能字节操作
serde = {version = "1.0", features = ["derive"] } # ✅ 序列化/反序列化
serde_json = "1.0"          # ✅ JSON 序列化/反序列化
tauri-plugin-dialog = "2"

[profile.dev]
incremental = true
